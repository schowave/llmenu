# Local toolchain and tasks. `mise install` once, then e.g. `mise run ci`.
# Keep tool versions in sync with .github/workflows/ci.yml.

[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
goreleaser = "2.18.3"
actionlint = "1.7.12"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"

[tasks.fmt]
description = "Format all Go files"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Fail if a Go file is not gofmt-formatted"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
'''

[tasks.tidy-check]
description = "Fail if go.mod/go.sum are not tidy"
run = ["go mod verify", "go mod tidy -diff"]

[tasks.vet]
description = "go vet"
run = "go vet ./..."

[tasks.test]
description = "Unit tests with race detector"
run = "go test -race -shuffle=on ./..."

[tasks.cover]
description = "Tests with coverage; fails below LLMENU_MIN_COVERAGE (default 85 %)"
run = "scripts/coverage.sh"

[tasks.mutation]
description = "Mutation testing with Gremlins (a few minutes); pass a package to narrow it, e.g. mise run mutation ./internal/targets"
run = "scripts/mutation.sh"

[tasks."mutation:changed"]
description = "Mutation testing only on lines changed against origin/main (LLMENU_DIFF_BASE to change), usually seconds"
run = 'scripts/mutation.sh --diff "${LLMENU_DIFF_BASE:-origin/main}"'

[tasks.compat]
description = "Real pi, opencode, codex and copilot read what llmenu generates (tools must be installed)"
run = "go test -tags compat -count=1 -v ./test/compat/"

[tasks.lint]
description = "golangci-lint (includes gosec)"
run = "golangci-lint run ./..."

[tasks.vuln]
description = "Known vulnerabilities in reachable code (govulncheck)"
run = "govulncheck ./..."

[tasks.workflows]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.release-check]
description = "Validate .goreleaser.yaml and build a local snapshot into dist/ (needs a git remote)"
run = ["goreleaser check", "goreleaser release --snapshot --clean"]

[tasks.build]
description = "Build llmenu into dist/"
run = "go build -o dist/llmenu ./cmd/llmenu"

[tasks.hooks]
description = "Use the repository's git hooks (.githooks: fmt, tidy, vet, lint before a commit; commit message shape)"
run = "git config core.hooksPath .githooks"

[tasks.install]
description = "Install llmenu into $(go env GOPATH)/bin"
run = "go install ./cmd/llmenu"

[tasks.sandbox]
description = "Fresh development sandbox: isolated HOME/config/keys, fake gateway, stand-in claude/codex/copilot"
run = "scripts/sandbox.sh fresh"
raw = true

[tasks."sandbox:resume"]
description = "Sandbox with the state of the last session"
run = "scripts/sandbox.sh resume"
raw = true

[tasks."sandbox:live"]
description = "Sandbox against your real gateway (llmenu setup inside); still isolated, still stand-in claude/codex/copilot"
run = "scripts/sandbox.sh live"
raw = true

[tasks."sandbox:clean"]
description = "Delete the sandbox"
run = "rm -rf .sandbox"

[tasks.ci]
description = "Everything CI checks, except the snapshot release"
depends = ["fmt-check", "tidy-check", "vet", "test", "cover", "lint", "vuln", "workflows"]

[tasks.demo]
description = "Record the README demo (docs/demo.gif) with VHS against the fake gateway; needs `brew install vhs`"
run = "scripts/demo.sh"
