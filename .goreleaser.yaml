# Release configuration (ADR-0001, section on release and distribution).
# Check: goreleaser check; dry run without publishing: mise run release-check
# Published by .github/workflows/release.yml when a GitHub release is published.
version: 2

project_name: llmenu

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - main: ./cmd/llmenu
    binary: llmenu
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/schowave/llmenu/internal/cli.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      # Scoop needs a zip for Windows.
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # The release is created in the GitHub UI; keep its title and notes and
  # only add the artifacts.
  mode: keep-existing
  replace_existing_artifacts: true

# Tap and bucket live in their own repos; GITHUB_TOKEN cannot write there, so
# the workflow passes TAP_GITHUB_TOKEN (fine-grained PAT, contents read/write
# on both repos). Snapshot builds never publish, so they do not need it.
homebrew_casks:
  - name: llmenu
    binaries: [llmenu]
    homepage: https://github.com/schowave/llmenu
    description: Pick LLMs from a LiteLLM gateway and wire them into Claude Code, Codex CLI, pi and opencode
    repository:
      owner: schowave
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_msg_template: "llmenu {{ .Tag }}"
    # Shell completion for bash, zsh and fish, generated by `llmenu completion`.
    generate_completions_from_executable:
      executable: llmenu
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    hooks:
      post:
        # The binaries are not signed; without this macOS refuses to start them.
        # GoReleaser still emits the `postflight` stanza that Homebrew 7 warns
        # about; switch to `postflight_steps` once GoReleaser supports it
        # (goreleaser/goreleaser#6870, #6873).
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/llmenu"]
          end

scoops:
  - name: llmenu
    homepage: https://github.com/schowave/llmenu
    description: Pick LLMs from a LiteLLM gateway and wire them into Claude Code, Codex CLI, pi and opencode
    license: MIT
    repository:
      owner: schowave
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_msg_template: "llmenu {{ .Tag }}"
