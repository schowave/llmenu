# Runs the real tools (pi, opencode, Codex CLI) at their latest versions
# against the configuration llmenu generates, to notice format changes early
# (ADR-0002). No gateway or key is needed; see test/compat.
name: Compatibility

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/targets/**"
      - "test/compat/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: Tools at @latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install tools
        run: npm install --global @earendil-works/pi-coding-agent@latest opencode-ai@latest @openai/codex@latest @github/copilot@latest
      - name: Tool versions
        run: |
          echo "pi       $(pi --version)"
          echo "opencode $(opencode --version)"
          echo "codex    $(codex --version)"
          echo "copilot  $(copilot --version)"
      - name: Compatibility tests
        env:
          LLMENU_COMPAT_REQUIRE: "1"
        run: go test -tags compat -count=1 -v ./test/compat/
