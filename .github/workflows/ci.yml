name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux: the same command as locally (mise.toml), so a green
      # `mise run check` means a green CI: fmt, tidy, vet, tests (-race),
      # coverage, golangci-lint, govulncheck, actionlint and the build.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: runner.os == 'Linux'
      - name: Setup
        if: runner.os == 'Linux'
        run: mise run setup
      - name: Check
        if: runner.os == 'Linux'
        run: mise run check
      # macOS and Windows: vet, tests and the build on that platform.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
      - name: Verify modules
        if: runner.os != 'Linux'
        run: go mod verify
      - name: Vet
        if: runner.os != 'Linux'
        run: go vet ./...
      - name: Test
        if: runner.os == 'macOS'
        run: go test -race -shuffle=on ./...
      - name: Test (Windows, without race detector)
        if: runner.os == 'Windows'
        run: go test -shuffle=on ./...
      - name: Build
        if: runner.os != 'Linux'
        run: go build -o ${{ runner.temp }}/ ./cmd/llmenu

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  release-check:
    name: Release build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --snapshot --clean
      - name: Cask must not run the binary during installation
        # Homebrew would run the unsigned, still quarantined binary before the
        # postflight hook removes the quarantine; macOS then blocks it.
        run: |
          if grep -n 'generate_completions_from_executable\|system_command.*llmenu"' dist/homebrew/Casks/llmenu.rb | grep -v xattr; then
            echo "::error::the cask executes llmenu during installation"; exit 1
          fi
