name: Release

# Create a release in the GitHub UI with a new tag like v0.1.0 and publish it.
# This workflow then builds all platforms, attaches the archives to that
# release and updates the Homebrew tap and the Scoop bucket.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) so
    # that TAP_GITHUB_TOKEN is only used after an explicit approval.
    environment: release
    permissions:
      contents: write # upload the archives to the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - name: Check tag format
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got '$TAG'"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      # Signed provenance for every archive listed in checksums.txt; users
      # check a download with: gh attestation verify <file> --repo schowave/llmenu
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
